services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: igno_hr_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - igno_hr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d igno_hr_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/igno_hr_dev?schema=public
    ports:
      - "3000:3000"
    volumes:
      - igno_hr_uploads:/data/hrms/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  igno_hr_postgres:
  igno_hr_uploads:

